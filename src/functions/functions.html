<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <script>
      (function () {
        function load(src, ok, fail) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = ok;
          s.onerror = fail;
          document.head.appendChild(s);
        }
        function app() {
          load('functions.js');
        }
        load('office-js/custom-functions-runtime.js', app, function () {
          load('https://appsforoffice.microsoft.com/lib/1/hosted/custom-functions-runtime.js', app, app);
        });
      })();
    </script>
  </head>
  <body></body>
</html>
